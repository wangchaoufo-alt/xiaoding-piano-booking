<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>小丁钢琴课 · 课时预约</title>
  <link rel="icon" href="logo.svg">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8f7f4;
    }

    .app-frame {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #f8f7f4;
    }

    .fallback {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 10;
      padding: 8px 12px;
      border-radius: 999px;
      color: #4f46e5;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      font: 13px/1.4 system-ui, sans-serif;
      text-decoration: none;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <iframe
    class="app-frame"
    src="https://piano-booking.app.workbuddy.host/"
    title="小丁钢琴课"
    allow="clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  >
    <a href="https://piano-booking.app.workbuddy.host/">直接打开小丁钢琴课</a>
  </iframe>
  <a class="fallback" href="https://piano-booking.app.workbuddy.host/" target="_blank" rel="noopener">在新窗口打开</a>
</body>
</html>
